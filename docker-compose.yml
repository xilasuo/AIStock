# 复盘簿（fupanbu-trading-journal）Docker Compose 配置
# 目标环境：Ubuntu 24 + Docker 26+
#
# 首次部署前请先在项目根目录创建 .env 文件：
#   cp .env.example .env   # 然后编辑填写 AI 密钥和登录凭据

services:
  fupanbu:
    build:
      context: .
      dockerfile: Dockerfile
    image: fupanbu-trading-journal:latest
    container_name: fupanbu
    # 永不从 registry 拉取，强制使用本地镜像（配合 local-build.ps1 预构建推送）
    pull_policy: never

    # 使用宿主网络模式：workerd 在默认 bridge 网络下出站访问 push2.eastmoney.com
    # 等国内数据源会 "Network connection lost"。host 模式让容器直接复用宿主网络栈，
    # 国内直连东财/腾讯/新浪，PE/PB 等行情数据正常获取。
    # 注意：启用后服务直接监听宿主 8787 端口（见 start.sh），不再做端口映射。
    network_mode: host

    volumes:
      # D1 数据持久化（本地 SQLite），容器重建不丢
      - ./data:/data
      # 云端「选股前置条件」配置持久化，容器重建不丢
      # 对应 app/api/strategy-scan/config/route.ts 的 overridesPath
      - ./cloud-config:/app/trading_agent/cloud_config

    restart: unless-stopped

    # 资源限制（Ubuntu 24 默认 cgroup v2，自动生效）
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

    # 健康检查
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9003/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    # AI 模型源（可选）；不配置则自动降级为"自动解释"模式
    # docker compose 自动加载同级 .env 文件的值
    environment:
      - TZ=Asia/Shanghai
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - AI_PROVIDER=${AI_PROVIDER:-}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_API_BASE=${AI_API_BASE:-}
      - AI_MODEL=${AI_MODEL:-}
      - MAIRUI_TOKEN=${MAIRUI_TOKEN:-}
      - NOTIFY_WEBHOOK_URLS=${NOTIFY_WEBHOOK_URLS:-}
      - CRON_SECRET=${CRON_SECRET:-}
      - STRATEGY_PUSH_TOKEN=${STRATEGY_PUSH_TOKEN:-}
      - APP_USERNAME=${APP_USERNAME:?请先在 .env 中设置 APP_USERNAME}
      - APP_PASSWORD=${APP_PASSWORD:?请先在 .env 中设置 APP_PASSWORD}
      - APP_AUTH_SECRET=${APP_AUTH_SECRET:?请先在 .env 中设置 APP_AUTH_SECRET}
